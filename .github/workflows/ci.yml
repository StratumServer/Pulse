name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege: nothing here writes to the repository. The job reads the checkout, restores
# the cached server and uploads the mod zips, none of which needs more than this.
permissions:
  contents: read

# A pull request's own commits share a group and cancel each other's stale run, which is the
# point: only the newest commit's result matters there. A push does not share its group with
# anything, keyed on the run id rather than the ref, because GitHub keeps only one queued run
# per group regardless of cancel-in-progress; sharing the ref the way the pull request side does
# would still let a third rapid push evict the second one's result before it ever runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VS_VERSION: "1.22.7"

jobs:
  # Docs-only changes (docs/**, any *.md, LICENSE) cannot affect the build or the tests, so there
  # is nothing for the heavy jobs below to catch. This job decides that once, from a plain git
  # diff, and the heavy jobs skip themselves through a job-level if reading its output. "Build &
  # tests" is the branch protection required check by that exact job name, and GitHub reports a
  # job skipped by a job-level if as success, so a docs-only pull request is not blocked by it
  # (see the pull request that introduced this job for the documentation citation). Whenever the
  # diff cannot be computed (new branch, force-pushed or missing base commit) this treats the
  # change as code, so anything uncertain still runs everything.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        run: |
          set -e
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi

          docs_only=false
          if [ -n "$BASE" ] \
            && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE" 2>/dev/null; then
            # --no-renames: without it, git's default rename detection folds a rename into a
            # single entry named only for the destination path, so renaming a code file into
            # docs/ (or to a .md name) would list only the new, docs-looking path and hide the
            # old, code-looking one. With it, both the old and the new path are listed, so a
            # rename out of or into code is judged on both names.
            files="$(git diff --no-renames --name-only "$BASE" "${{ github.sha }}")"
            docs_only=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/*|*.md|LICENSE) ;;
                *) docs_only=false ;;
              esac
            done <<< "$files"
          else
            files="<diff not computable, treated as code>"
          fi

          echo "Changed files:"
          echo "$files"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & tests
    needs: changes
    # !cancelled(): without it, a failed changes job would leave this job skipped rather than
    # run, and a job a required check skips through a failed needs job still reports success,
    # the opposite of what a failed classification should mean. !cancelled() falls back to
    # actually running the build and tests, the same as always() would, but without also
    # forcing the job to run after the workflow run itself was cancelled: GitHub's expressions
    # documentation notes that always() returns true even when the run was canceled, and
    # recommends !cancelled() for exactly this case.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # 15, then 20, were enough until tools/mutation-check.sh and the unit suites kept growing
    # across several branches landing around the same time: a run timed out at 15m15s, then
    # another at 20m4s, both with nothing actually wrong, just out of budget. 30 gives real
    # headroom instead of chasing the same timeout a third time.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The changelog and the guide promise the mod tag on every entry, so neither mod may use the
      # server's logger, except the EntryAdded subscription: it has to see the entries of every mod.
      - name: Check that both mods log through their own logger
        run: |
          set -e
          lines=$(grep -rnE '\.Logger\b' Pulse Pulse.Otlp --include='*.cs')
          if echo "$lines" | grep -vE 'Mod\.Logger|EntryAdded'; then
            echo "::error::The lines above use the server's logger, so their entries carry no mod tag. Use Mod.Logger."
            exit 1
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache Vintage Story server
        id: cache-vs
        uses: actions/cache@v6
        with:
          path: ~/vs
          key: vs-server-linux-x64-${{ env.VS_VERSION }}

      - name: Download Vintage Story server
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSL --proto '=https' --proto-redir '=https' -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
          mkdir -p "$HOME/vs"
          tar -xzf vs_server.tar.gz -C "$HOME/vs"

      # The csproj files resolve VintagestoryAPI.dll straight from $VINTAGE_STORY. The .pdb has
      # to sit next to the dll: the engine's logger reads its own source path from stack-trace
      # file info at boot and crashes without it.
      - name: Export VINTAGE_STORY
        run: |
          set -e
          DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"
          echo "Resolved VINTAGE_STORY=$DLL_DIR"

      - name: Build
        run: dotnet build Pulse.slnx -c Release

      - name: Unit tests
        run: |
          dotnet test Pulse.Tests/Pulse.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults
          dotnet test Pulse.Otlp.Tests/Pulse.Otlp.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=otlp-unit-tests.trx" \
            --results-directory TestResults

      # Applies representative mutations to every file holding logic the unit suites can drive,
      # one at a time, and requires the suite to fail on each. Stand-in for Stryker, which does
      # not yet run correctly on the .NET 10 SDK.
      - name: Mutation check
        run: ./tools/mutation-check.sh

      # These boot a real headless Vintage Story server in-process (Atlas), load the staged
      # mod, and scrape it over HTTP. The OTLP suite stages both mods and puts a fake collector
      # on the other end of a socket, so it proves the export path end to end.
      #
      # The fixtures pin ports 29464 to 29486, below the range the kernel assigns from by itself,
      # because a socket of the test platform landing on a fixture port makes the mod fail its
      # bind and every scenario of that class fail with it. The first line prints that range, so
      # a runner image that ever moves it below 29486 shows in the log of the run it breaks.
      - name: Atlas scenarios
        run: |
          cat /proc/sys/net/ipv4/ip_local_port_range
          dotnet test Pulse.Scenarios/Pulse.Scenarios.csproj -c Release --no-build \
            --filter "Category!=Cost" \
            --logger "trx;LogFileName=scenarios.trx" \
            --results-directory TestResults
          dotnet test Pulse.Otlp.Scenarios/Pulse.Otlp.Scenarios.csproj -c Release --no-build \
            --logger "trx;LogFileName=otlp-scenarios.trx" \
            --results-directory TestResults

      # The console of a red scenario run never shows why a server misbehaved: the engine log,
      # with lines such as "Pulse could not bind", only lands in the TRX's run-level output.
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Package the mod zips
        run: |
          dotnet build Pulse/Pulse.csproj -c Release -t:PackageMod
          dotnet build Pulse.Otlp/Pulse.Otlp.csproj -c Release -t:PackageMod
          unzip -l artifacts/pulse_*.zip
          unzip -l artifacts/pulseotlp_*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: pulse-mod-zips
          path: artifacts/*.zip
          if-no-files-found: error

  windows-unit-tests:
    name: Unit tests (Windows)
    needs: changes
    # See build-and-test's !cancelled() above: the same fallback applies here.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    # GitHub's Windows runners execute every step as an administrator. That is exactly the
    # privilege MetricsHttpServer's release notes say a server no longer needs on Windows, so a
    # green run here proves the socket server works on Windows, not that it works without admin
    # rights: nothing here drops privileges to check that second, stronger claim, which needs a
    # non-administrator account this runner cannot provide.
    #
    # Only the two unit suites run here (Pulse.Tests, Pulse.Otlp.Tests): they drive
    # MetricsHttpServer and the OTLP config translation directly, in process, with no server
    # boot. Pulse.Scenarios and Pulse.Otlp.Scenarios boot a real headless Vintage Story server
    # built for Linux and stay out of scope for a Windows job.
    #
    # Every run step below asks for bash explicitly. It ships with the runner's Git tools, so the
    # download and extraction steps can reuse the Linux job's script almost verbatim, and it
    # keeps the same fail-fast behaviour that script already relies on: pwsh, the Windows
    # default, does not stop a multi-line script when a non-final command fails, so a build
    # step's second command overwriting the first one's failure with its own success would
    # otherwise leave a red suite reported as a green step.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache Vintage Story server
        id: cache-vs
        uses: actions/cache@v6
        with:
          path: ~/vs
          key: vs-server-windows-${{ env.VS_VERSION }}

      # Reuses the same linux-x64 archive as the Linux job instead of the CDN's separate
      # vs_server_win-x64 zip (confirmed to exist alongside it): VintagestoryAPI.dll and
      # VintagestoryLib.dll are plain managed assemblies, identical whichever OS archive they
      # ship in, and this job never runs the server itself, only resolves $VINTAGE_STORY so the
      # two test projects can reference the dll. One archive to track instead of two, and both CI
      # jobs then build against the exact same bits rather than two copies that could drift.
      - name: Download Vintage Story server
        if: steps.cache-vs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          curl -sSL --proto '=https' --proto-redir '=https' -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
          mkdir -p "$HOME/vs"
          tar -xzf vs_server.tar.gz -C "$HOME/vs"

      # Same resolution as the Linux job, plus one step Linux does not need: cygpath -w turns Git
      # Bash's own POSIX-style path (what find and dirname hand back here) into the native
      # Windows path form, since that is the literal string MSBuild substitutes into
      # $(VINTAGE_STORY) for the HintPath in a later, non-bash step.
      - name: Export VINTAGE_STORY
        shell: bash
        run: |
          set -e
          DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
          WIN_DLL_DIR="$(cygpath -w "$DLL_DIR")"
          echo "VINTAGE_STORY=$WIN_DLL_DIR" >> "$GITHUB_ENV"
          echo "Resolved VINTAGE_STORY=$WIN_DLL_DIR"

      # Builds only the two test projects, not the whole solution: dotnet build follows each
      # project's own references (Pulse.csproj and Pulse.Otlp.csproj respectively), which is
      # everything either suite needs, without also building the Linux-only scenario projects.
      - name: Build
        shell: bash
        run: |
          dotnet build Pulse.Tests/Pulse.Tests.csproj -c Release
          dotnet build Pulse.Otlp.Tests/Pulse.Otlp.Tests.csproj -c Release

      - name: Unit tests
        shell: bash
        run: |
          dotnet test Pulse.Tests/Pulse.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults
          dotnet test Pulse.Otlp.Tests/Pulse.Otlp.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=otlp-unit-tests.trx" \
            --results-directory TestResults
