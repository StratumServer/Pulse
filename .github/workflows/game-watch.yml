name: game-watch

# Weekly tripwire: does Pulse still build and pass against the newest STABLE Vintage Story server
# version, not just the VS_VERSION pinned in ci.yml? Pulse's engine-probe metrics
# (Pulse/EngineProbe.cs) hold a compile-time reference to VintagestoryLib.dll, a closed engine
# assembly the game's authors change freely between versions with no compatibility promise; by
# design, a game update that renames or moves the internal types it reads breaks the Pulse build
# rather than shipping a mod that quietly serves fewer metrics (see the main README's "Degraded
# mode" section). That's the right failure mode for a release, but it should be caught here, on
# the game's own schedule, rather than by a user updating their server and finding CI red on a
# PR that touched nothing.
#
# This workflow changes nothing in the repo. It only reports: a version mismatch that still
# builds and passes exits green with a notice; a version mismatch that fails to build or test
# fails the job, which GitHub surfaces per the repo's own notification settings. Bumping
# VS_VERSION in ci.yml, sonar.yml and release.yml once that happens is a separate, deliberate
# change.
#
# GitHub only schedules a workflow that exists on the repository's default branch (main); a copy
# living only on dev never fires on its own, which is why this file has to be on main. main and
# dev can carry different VS_VERSION pins once dev moves ahead of a release, so the job runs as
# a matrix over both refs: each leg checks out its own ref and reads that ref's own ci.yml, so
# main is watched against the version it actually ships and dev against the version it is
# currently building toward.
#
# Runs every Monday at 06:00 UTC against both main and dev, plus on demand via workflow_dispatch
# (set force: true to run the download/build/unit/scenario path even when nothing differs, to
# prove that path still works).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the download/build/unit/scenario path even if already pinned to the newest stable"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time is enough for a weekly tripwire; a second scheduled or dispatched run
# waiting behind it beats two overlapping matrices downloading the same server twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-newest-stable:
    name: Build & test against newest stable (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [main, dev]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      # ci.yml's VS_VERSION is the one place Pulse's pinned game version lives; read it from
      # there instead of keeping a second copy here that could quietly drift out of sync.
      - name: Read the pinned version from ci.yml
        id: pinned
        run: |
          set -e
          PINNED="$(grep -oP 'VS_VERSION:\s*"\K[^"]+' .github/workflows/ci.yml)"
          [ -n "$PINNED" ] || { echo "::error::could not read VS_VERSION out of ci.yml"; exit 1; }
          echo "version=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Pinned VS_VERSION: $PINNED"

      # api.vintagestory.at/stable-unstable.txt, the traditionally-cited path, 404s, and nothing
      # else guessed on that host resolves either (checked with curl from this repo's own CI
      # runner class before writing this). mods.vintagestory.at/api/gameversions, the mod
      # database's own API, does answer reliably: it lists every game version tag in release
      # order, and stays current because mod authors need the tag the moment a new game version
      # ships.
      #
      # The extraction keeps only a dotted run of digits that reaches all the way to the closing
      # quote, so a prerelease tag (-rc.N, -pre.N, -dev.N) never matches at all: taking the
      # highest of what is left is "the newest stable version" with no separate hyphen filter
      # needed. This is a third-party API's response, read straight into a shell variable that
      # later feeds a curl URL and a build; a name field that is anything other than digits and
      # dots, hyphen or not, now simply produces no match instead of reaching that variable.
      # Tested against a crafted "9.9.9$(id)" entry: the old hyphen filter let it through
      # (nothing to drop, there is no hyphen), this pattern drops it (nothing before the closing
      # quote is only digits and dots).
      - name: Query the newest stable server version
        id: newest
        run: |
          set -e
          NEWEST="$(curl -sSL --proto '=https' --max-time 30 "https://mods.vintagestory.at/api/gameversions" \
            | grep -oP '"name":"\K[0-9]+(\.[0-9]+)*(?=")' | sort -V | tail -1)"
          [ -n "$NEWEST" ] || { echo "::error::could not determine the newest stable version from mods.vintagestory.at"; exit 1; }
          echo "version=$NEWEST" >> "$GITHUB_OUTPUT"
          echo "Newest stable: $NEWEST"

      - name: Compare
        id: compare
        run: |
          if [ "${{ steps.pinned.outputs.version }}" = "${{ steps.newest.outputs.version }}" ]; then
            echo "differs=false" >> "$GITHUB_OUTPUT"
          else
            echo "differs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Already current
        if: steps.compare.outputs.differs == 'false' && !inputs.force
        run: echo "::notice::ci.yml is already pinned to the newest stable version (${{ steps.pinned.outputs.version }}). Nothing to do."

      - name: Setup .NET 10
        if: steps.compare.outputs.differs == 'true' || inputs.force
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # No actions/cache here on purpose: unlike ci.yml, which downloads the same pinned version
      # on every push, this step only runs when the newest stable differs from the pin, or on a
      # forced dispatch, so most weeks there is nothing to reuse. See contrib/alerts if you're
      # looking for the operations kit instead.
      - name: Download the target Vintage Story server
        if: steps.compare.outputs.differs == 'true' || inputs.force
        run: |
          set -e
          VS_VERSION="${{ steps.newest.outputs.version }}"
          curl -sSL --proto '=https' --proto-redir '=https' -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
          mkdir -p "$HOME/vs"
          tar -xzf vs_server.tar.gz -C "$HOME/vs"

      - name: Export VINTAGE_STORY
        if: steps.compare.outputs.differs == 'true' || inputs.force
        run: |
          set -e
          DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"
          echo "Resolved VINTAGE_STORY=$DLL_DIR"

      - name: Build
        if: steps.compare.outputs.differs == 'true' || inputs.force
        run: dotnet build Pulse.slnx -c Release

      - name: Unit tests
        if: steps.compare.outputs.differs == 'true' || inputs.force
        run: |
          dotnet test Pulse.Tests/Pulse.Tests.csproj -c Release --no-build
          dotnet test Pulse.Otlp.Tests/Pulse.Otlp.Tests.csproj -c Release --no-build

      # Same two suites ci.yml runs, boot a real headless server through Atlas and prove the
      # build works against the new game version end to end, not just that it compiles.
      - name: Atlas scenarios
        if: steps.compare.outputs.differs == 'true' || inputs.force
        run: |
          dotnet test Pulse.Scenarios/Pulse.Scenarios.csproj -c Release --no-build
          dotnet test Pulse.Otlp.Scenarios/Pulse.Otlp.Scenarios.csproj -c Release --no-build

      - name: Newer stable found
        if: steps.compare.outputs.differs == 'true'
        run: echo "::notice::Vintage Story ${{ steps.newest.outputs.version }} is out (ci.yml is pinned to ${{ steps.pinned.outputs.version }}) and Pulse builds and passes against it. Bump VS_VERSION in ci.yml, sonar.yml and release.yml when convenient."

      - name: Forced run complete
        if: steps.compare.outputs.differs == 'false' && inputs.force
        run: echo "::notice::force=true ran the build/test path even though ci.yml is already pinned to the newest stable version (${{ steps.pinned.outputs.version }}). Nothing to bump."
