name: mutation

# Line coverage says the unit suites execute the code; it cannot say whether anything is
# checked. Stryker answers that: it changes the code and asks whether a test notices. The lane
# is a ratchet, not a target. Each project breaks just under the score measured when this file
# landed, so tests cannot quietly get weaker; raising a threshold is a deliberate commit.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - "Pulse/**"
      - "Pulse.Otlp/**"
      - "Pulse.Tests/**"
      - "Pulse.Otlp.Tests/**"
      # Stryker builds the whole solution, so anything that can break that build has to be
      # able to trigger this lane.
      - "Pulse.slnx"
      - "Directory.Build.props"
      - ".config/dotnet-tools.json"
      - "stryker/**"
      - ".github/workflows/mutation.yml"

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VS_VERSION: "1.22.7"

jobs:
  stryker:
    name: Mutation (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A weak spot in one project should not hide the other.
      fail-fast: false
      matrix:
        # One job per project rather than both in one, so the lane's wall clock is the slower
        # project rather than their sum.
        #
        # stryker/Pulse.json and stryker/Pulse.Otlp.json exclude the same files sonar.yml's
        # sonar.coverage.exclusions does (PulseModSystem.cs, EngineProbe.cs, AttributionProbe.cs,
        # AttributionMetrics.Server.cs, PulseOtlpModSystem.cs) for the same reason: this suite
        # cannot reach them, only the Atlas scenarios can, since they need a live server. Keep the
        # two lists in step; a file added to one belongs on the other. Before the exclusion these
        # mutants counted as NoCoverage, which drags the headline score down the same way a real
        # survivor does, for code no unit test was ever going to kill.
        #
        # Two CI runs on the commit that added the exclusion, one from the pull request and one
        # from workflow_dispatch minutes apart on the same code:
        #
        #   Pulse        87.59 %, then 88.35 %   (342-344 killed, 41-44 survived, 4-5 timeouts)
        #   Pulse.Otlp   85.11 %, then 80.85 %   (38-40 killed,    7-9 survived,  0 timeouts)
        #
        # Pulse's own two numbers are close together and its survivor list is nearly identical
        # between the runs (43 of ~45 lines survived both times, only a couple trading with a
        # timeout at the margin), the kind of spread Atlas documents too. That list is a real
        # punch list, not noise, and it is heavily concentrated in one place: seventeen of the
        # forty-three repeat survivors are in Pulse/AttributionMetrics.cs (lines 84-94, 201-228),
        # the newest file in the project. Its own test file did not kill anywhere near what it
        # should have.
        #
        # Pulse.Otlp did not stabilise. Comparing the two runs' survivor lists directly: only 2
        # mutants survived both times, while 5 survived only the first run and 7 only the second,
        # on identical code. Coverage-based analysis still fails outright ("It looks like the
        # test coverage capture failed") in both runs, at nearly the same point in the log with
        # nearly the same phase timings, so Stryker still falls back to running the whole test
        # suite per mutant; the exclusion only shrank how much that fallback has to cover (89
        # tested mutants down to 47), it did not fix the fallback's reliability, which is exactly
        # what the run-to-run disagreement on 10-12 individual mutants shows. Traced locally with
        # -V trace -L: every fallback test host for Pulse.Otlp launches against
        # Pulse.Otlp.Scenarios's runtimeconfig, depsfile and testhost.dll rather than
        # Pulse.Otlp.Tests's own. Of the 2 mutants that did survive both runs, one is explained
        # and is not a gap: Pulse.Otlp.csproj compiles a linked copy of Pulse/ConfigUpgrade.cs,
        # which Pulse.Otlp.Tests never calls (Pulse.Tests's own ConfigUpgradeTests.cs is what
        # covers it), so mutants in that copy read as uncovered from this project's suite no
        # matter how reliable the run is; several of the non-repeating survivors are the same
        # file for the same reason. The other, OtlpOptions.cs:100 (RenderHeaders defaulting a
        # null header value with `??`), is a real gap: no existing test passes a header with a
        # null value. Neither a trimmed solution that drops the Scenarios projects (which instead
        # reproduces the original all-mutants-survived failure from issue #2, restorable from
        # dcc17ad if this needs re-proving) nor Microsoft.NET.Test.Sdk 17.11.1 or 18.10.1 in
        # place of 17.14.1 changes any of this; it looks like a Stryker/VSTest test host
        # resolution quirk triggered by a same-shaped sibling test project, not a Pulse-side
        # setting. tools/mutation-check.sh's 44 hand-mutations, run separately in ci.yml, are
        # unaffected: it drives dotnet test directly and never goes through Stryker's coverage
        # capture or host reuse.
        #
        # Runtime: the pull-request run took 46m9s for Pulse against 14m14s for Pulse.Otlp; the
        # workflow_dispatch run minutes later took 24m14s and 14m54s. Both runs' coverage-capture
        # phase for Pulse took near-identical time (2m48s and 2m50s) and used the same successful
        # 'CoverageBasedTest' mode with the same 4-5 timeouts; all 22 minutes of the difference
        # sat in the per-mutant testing phase alone, for fewer tested mutants (390 against the
        # earlier 396), which is a shared-runner having a slow stretch, not the exclusion or the
        # config. Pulse.Otlp's own two runs, by contrast, landed within forty seconds of each
        # other, so its fallback mode is slow but its wall clock, unlike its score, is stable.
        #
        # giving break 83 and 70. Pulse's margin is the usual few points under a stable number;
        # Pulse.Otlp's is wide on purpose, under the worse of two runs that disagree with each
        # other by ten points, to absorb the spread this comment documents rather than pretend it
        # is not there. Raising a threshold is a deliberate commit, not a side effect of adding
        # tests elsewhere.
        project: [Pulse, Pulse.Otlp]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache Vintage Story server
        id: cache-vs
        uses: actions/cache@v6
        with:
          path: ~/vs
          key: vs-server-linux-x64-${{ env.VS_VERSION }}

      - name: Download Vintage Story server
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSL --proto '=https' --proto-redir '=https' -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
          mkdir -p "$HOME/vs"
          tar -xzf vs_server.tar.gz -C "$HOME/vs"

      # The csproj files resolve VintagestoryAPI.dll straight from $VINTAGE_STORY. Stryker builds
      # the whole solution, which includes the Atlas scenario projects, so this has to run even
      # though the mutation run itself never boots a server.
      - name: Export VINTAGE_STORY
        run: |
          set -e
          DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"
          echo "Resolved VINTAGE_STORY=$DLL_DIR"

      # dotnet-stryker is pinned in .config/dotnet-tools.json, so the lane cannot change its
      # verdict because a new Stryker shipped new mutators overnight.
      - name: Restore dotnet tools
        run: dotnet tool restore

      # Not --since. A pull request that only deletes a contract test would leave every mutant
      # filtered out under --since and pass, which is exactly the case this lane exists to catch.
      # The full run is a stable number. Each mutant run restarts a test host, and that startup
      # cost dominates on a shared runner: the timeout is generous because the score itself is
      # the fast part, the fixed per-mutant overhead is what takes the wall clock past local.
      - name: Mutation test ${{ matrix.project }}
        run: dotnet dotnet-stryker -f stryker/${{ matrix.project }}.json --skip-version-check --output StrykerOutput/${{ matrix.project }}

      # The surviving mutants are the finding; without the report a red job only says a number
      # moved.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.project }}
          path: StrykerOutput/${{ matrix.project }}/reports/mutation-report.json
          if-no-files-found: warn
