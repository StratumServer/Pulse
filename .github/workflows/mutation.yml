name: mutation

# Line coverage says the unit suites execute the code; it cannot say whether anything is
# checked. Stryker answers that: it changes the code and asks whether a test notices. The lane
# is a ratchet, not a target. Each project breaks just under the score measured when this file
# landed, so tests cannot quietly get weaker; raising a threshold is a deliberate commit.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - "Pulse/**"
      - "Pulse.Otlp/**"
      - "Pulse.Tests/**"
      - "Pulse.Otlp.Tests/**"
      # Stryker builds the whole solution, so anything that can break that build has to be
      # able to trigger this lane.
      - "Pulse.slnx"
      - "Directory.Build.props"
      - ".config/dotnet-tools.json"
      - "stryker/**"
      - ".github/workflows/mutation.yml"

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VS_VERSION: "1.22.7"

jobs:
  stryker:
    name: Mutation (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A weak spot in one project should not hide the other.
      fail-fast: false
      matrix:
        # One job per project rather than both in one, so the lane's wall clock is the slower
        # project rather than their sum.
        #
        # stryker/Pulse.json and stryker/Pulse.Otlp.json exclude the same files sonar.yml's
        # sonar.coverage.exclusions does (PulseModSystem.cs, EngineProbe.cs, AttributionProbe.cs,
        # AttributionMetrics.Server.cs, PulseOtlpModSystem.cs) for the same reason: this suite
        # cannot reach them, only the Atlas scenarios can, since they need a live server. Keep the
        # two lists in step; a file added to one belongs on the other. Before the exclusion these
        # mutants counted as NoCoverage, which drags the headline score down the same way a real
        # survivor does, for code no unit test was ever going to kill.
        #
        # Local score after adding the exclusion, each run including its own solution build:
        #
        #   Pulse        88.86 %   344 killed,  39 survived, 7 timeouts,   5 uncovered
        #   Pulse.Otlp   91.49 %    43 killed,   4 survived, 0 timeouts,   0 uncovered
        #
        # Pulse.Otlp's own coverage-based run still fails outright ("It looks like the test
        # coverage capture failed") and Stryker still falls back to running the whole test suite
        # per mutant; the exclusion above only shrinks how much that fallback has to cover (89
        # tested mutants down to 47), it does not fix the fallback itself. Traced with -V trace
        # -L: every fallback test host for Pulse.Otlp launches against Pulse.Otlp.Scenarios's
        # runtimeconfig, depsfile and testhost.dll rather than Pulse.Otlp.Tests's own, and
        # Stryker's injection step writes the mutated Pulse.Otlp.dll into that Scenarios
        # project's staged copy as well as the real one. Measured scores before the exclusion:
        # local a stable 96.63-97.75 % across repeated runs, CI 85.39 % and 91.01 % on two
        # different commits; some individual survivors persisted across every one of those runs
        # despite sitting under existing, direct, unconditional assertions (a fresh object's
        # default property value, a boolean guard with dedicated tests on both branches), which
        # does not read as a real gap so much as this same fallback mode failing to attribute a
        # result correctly. Neither a trimmed solution that drops the Scenarios projects (which
        # instead reproduces the original all-mutants-survived failure from issue #2, restorable
        # from dcc17ad if this needs re-proving) nor Microsoft.NET.Test.Sdk 17.11.1 or 18.10.1 in
        # place of 17.14.1 changes any of this; it looks like a Stryker/VSTest test host
        # resolution quirk triggered by a same-shaped sibling test project, not a Pulse-side
        # setting. tools/mutation-check.sh's 44 hand-mutations, run separately in ci.yml, are
        # unaffected: it drives dotnet test directly and never goes through Stryker's coverage
        # capture or host reuse.
        #
        # giving break 80 and 65, comfortably under every measurement taken so far in either
        # direction. Raising a threshold is a deliberate commit, not a side effect of adding
        # tests elsewhere.
        project: [Pulse, Pulse.Otlp]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache Vintage Story server
        id: cache-vs
        uses: actions/cache@v6
        with:
          path: ~/vs
          key: vs-server-linux-x64-${{ env.VS_VERSION }}

      - name: Download Vintage Story server
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSL --proto '=https' --proto-redir '=https' -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
          mkdir -p "$HOME/vs"
          tar -xzf vs_server.tar.gz -C "$HOME/vs"

      # The csproj files resolve VintagestoryAPI.dll straight from $VINTAGE_STORY. Stryker builds
      # the whole solution, which includes the Atlas scenario projects, so this has to run even
      # though the mutation run itself never boots a server.
      - name: Export VINTAGE_STORY
        run: |
          set -e
          DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"
          echo "Resolved VINTAGE_STORY=$DLL_DIR"

      # dotnet-stryker is pinned in .config/dotnet-tools.json, so the lane cannot change its
      # verdict because a new Stryker shipped new mutators overnight.
      - name: Restore dotnet tools
        run: dotnet tool restore

      # Not --since. A pull request that only deletes a contract test would leave every mutant
      # filtered out under --since and pass, which is exactly the case this lane exists to catch.
      # The full run is a stable number. Each mutant run restarts a test host, and that startup
      # cost dominates on a shared runner: the timeout is generous because the score itself is
      # the fast part, the fixed per-mutant overhead is what takes the wall clock past local.
      - name: Mutation test ${{ matrix.project }}
        run: dotnet dotnet-stryker -f stryker/${{ matrix.project }}.json --skip-version-check --output StrykerOutput/${{ matrix.project }}

      # The surviving mutants are the finding; without the report a red job only says a number
      # moved.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.project }}
          path: StrykerOutput/${{ matrix.project }}/reports/mutation-report.json
          if-no-files-found: warn
