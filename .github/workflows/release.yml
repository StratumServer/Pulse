name: release

# Tag-driven releases: push a tag like v0.1.0 and this builds, tests, packages the mod zip and
# attaches it to a GitHub release. A hyphen in the tag (v0.1.0-indev.1) marks a prerelease;
# stable versions always get at least one prerelease first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VS_VERSION: "1.22.7"

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The tag is the source of truth; refuse to ship if the code disagrees, so a release can
      # never carry a stale version string. Prerelease suffixes live only in the tag: the tag's
      # base version (before any hyphen) has to match modinfo.json and the csproj.
      - name: Check the tag matches the code's versions
        run: |
          set -e
          BASE="${GITHUB_REF_NAME#v}"; BASE="${BASE%%-*}"
          MOD_VERSION=$(grep -oP '"version":\s*"\K[^"]+' Pulse/modinfo.json)
          CSPROJ_VERSION=$(grep -oP '<Version>\K[^<]+' Pulse/Pulse.csproj)
          FAIL=0
          [ "$MOD_VERSION" = "$BASE" ] || { echo "::error::Pulse/modinfo.json says '$MOD_VERSION', tag base says '$BASE'"; FAIL=1; }
          [ "$CSPROJ_VERSION" = "$BASE" ] || { echo "::error::Pulse/Pulse.csproj says '$CSPROJ_VERSION', tag base says '$BASE'"; FAIL=1; }
          exit $FAIL

      - name: Cache Vintage Story server
        id: cache-vs
        uses: actions/cache@v6
        with:
          path: ~/vs
          key: vs-server-linux-x64-${{ env.VS_VERSION }}

      - name: Download Vintage Story server
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSL --proto '=https' --proto-redir '=https' -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
          mkdir -p "$HOME/vs"
          tar -xzf vs_server.tar.gz -C "$HOME/vs"

      - name: Export VINTAGE_STORY
        run: |
          set -e
          DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -e
          dotnet build Pulse.slnx -c Release
          dotnet test Pulse.Tests/Pulse.Tests.csproj -c Release --no-build
          dotnet test Pulse.Scenarios/Pulse.Scenarios.csproj -c Release --no-build

      # The zip is named after the tag, prerelease suffix included; modinfo.json keeps the base
      # version, which is what the game compares.
      - name: Package
        run: |
          set -e
          dotnet build Pulse/Pulse.csproj -c Release -t:PackageMod
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE=(artifacts/pulse_*.zip)
          mv "${SOURCE[0]}" "artifacts/pulse_${VERSION}.zip"
          ls -l artifacts/

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/pulse_${GITHUB_REF_NAME#v}.zip" \
            --title "Pulse $GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE
