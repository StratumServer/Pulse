name: sonar

# Static analysis published to SonarCloud (project StratumServer_Pulse).
#
# Kept out of ci.yml on purpose: this job pulls a JDK and a scanner tool on top of the normal
# build, and it is not in the repository's required checks, so a red run here never blocks a
# merge.
#
# The quality gate is awaited: /d:sonar.qualitygate.wait=true on the begin step makes the end
# step poll SonarCloud and fail the job when the gate fails. That matters because SonarCloud no
# longer decorates pull requests with a comment or check annotation (nothing has appeared on a
# pull request itself since #49), so without this the job stayed green on a failing gate, which is
# exactly what happened on a pull request this week. The scanner's default sonar.qualitygate.timeout
# (300 seconds) is left alone: this project's SonarCloud background tasks process in a few seconds,
# nowhere near that budget. Read the full measures on SonarCloud's own project page; this job only
# surfaces pass or fail.
#
# Automatic Analysis is disabled on the SonarCloud side: C# has to be analysed while it compiles,
# which is what the begin/build/end sequence below does.
#
# SonarCloud's free plan only accepts analysis for the SonarCloud project's main branch, which
# is set to dev, not this repository's release branch main. A push straight
# to main (the push that landed #97 on 74005f6) fails outright, and every pull request targeting
# main fails at the quality gate with "Not authorized or project not found" (the API's own
# message is "Organization is not allowed to access data from PR targeting non main branches").
# So this workflow never runs against main: main is out of the push trigger below, and the job
# skips itself when a pull request's base is main. A promotion pull request into main carries
# code already analysed on dev, so nothing goes unanalysed.
#
# It also skips itself on a docs-only change (docs/**, any *.md, LICENSE): the "changes" job
# below decides that from a plain git diff, the same way ci.yml does.

on:
  push:
    branches: [dev]
  pull_request:

# Least privilege: nothing here writes to the repository. The job only reads the checkout and
# publishes analysis to SonarCloud over the API, authenticated with SONAR_TOKEN rather than any
# repository permission.
permissions:
  contents: read

# One analysis per branch and workflow, unlike ci.yml's per-run grouping: here the newest push
# or pull request commit is the only result worth keeping, so letting it supersede whatever was
# still queued ahead of it is correct, not a gap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VS_VERSION: "1.22.7"

jobs:
  # Same job as ci.yml's: classifies the push or pull request as docs-only or code from a plain
  # git diff, so the sonar job below can skip itself on a docs-only change.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        run: |
          set -e
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi

          docs_only=false
          if [ -n "$BASE" ] \
            && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE" 2>/dev/null; then
            # --no-renames: see ci.yml's identical classify step for why this matters.
            files="$(git diff --no-renames --name-only "$BASE" "${{ github.sha }}")"
            docs_only=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/*|*.md|LICENSE) ;;
                *) docs_only=false ;;
              esac
            done <<< "$files"
          else
            files="<diff not computable, treated as code>"
          fi

          echo "Changed files:"
          echo "$files"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  sonar:
    name: SonarCloud analysis
    needs: changes
    # Two cases where SONAR_TOKEN is not there to be had, and the scanner cannot authenticate
    # without it: a fork pull request runs without repository secrets, and a Dependabot pull
    # request gets the separate Dependabot secret store instead, even though the branch lives in
    # this repository. Both tests apply to pull_request only; a push is always from this
    # repository with the repository's own secrets. github.base_ref is only set for pull_request
    # events, and rules out a pull request targeting main for the reason at the top of this file;
    # the push trigger above already leaves main out for the same reason. !cancelled(): this job
    # is not a required check, but the same reasoning as ci.yml's build-and-test still applies, a
    # failed changes job should fall back to running analysis rather than silently skip it, while
    # still letting a cancelled run stop this job. GitHub's expressions documentation notes that
    # always() returns true even when the run was canceled, and recommends !cancelled() instead.
    if: >-
      !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request'
      || (github.base_ref != 'main'
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Full history, not a shallow clone: Sonar reads git blame to attribute issues and to work
      # out which lines count as new code. Shallow clones also break pull request decoration.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The scanner is a Java program; the dotnet tool is a wrapper around it.
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache Vintage Story server
        id: cache-vs
        uses: actions/cache@v6
        with:
          path: ~/vs
          key: vs-server-linux-x64-${{ env.VS_VERSION }}

      - name: Download Vintage Story server
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSL --proto '=https' --proto-redir '=https' -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
          mkdir -p "$HOME/vs"
          tar -xzf vs_server.tar.gz -C "$HOME/vs"

      - name: Export VINTAGE_STORY
        run: |
          set -e
          DLL_DIR="$(dirname "$(find "$HOME/vs" -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"

      - name: Install the Sonar scanner
        run: |
          set -e
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # begin and end have to wrap the build: the C# rules run as Roslyn analyzers during
      # compilation, so anything compiled outside this pair is invisible to Sonar. Test projects
      # are recognised from their Microsoft.NET.Test.Sdk reference and classified automatically.
      - name: Sonar begin
        env:
          # Through the environment rather than an inline ${{ }} expansion: a secret interpolated
          # straight into a run block ends up in the generated script.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # The two ModSystems, the engine probe, and the live-server halves of AttributionMetrics and
          # StratumTimingsMetrics are excluded from coverage the way Nimbus excludes its ServerMod: the
          # Atlas scenarios exercise them against a live embedded server, but the game's loader loads
          # the staged dll outside coverlet's instrumentation, so that execution can never reach a
          # coverage report. AttributionMetrics.Server.cs is only the construction, the /pulse command
          # and the reload path, and StratumTimingsMetrics.Server.cs only the lookup of Stratum's type
          # and the reload; AttributionMetrics.cs and StratumTimingsMetrics.cs themselves are not
          # excluded, since a unit test drives them directly.
          # Everything else with coverable logic lives in the classes the unit suite drives directly,
          # and those stay under the 80% gate.
          dotnet sonarscanner begin \
            /k:"StratumServer_Pulse" \
            /o:"stratumserver" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,docs/**" \
            /d:sonar.coverage.exclusions="Pulse/PulseModSystem.cs,Pulse.Otlp/PulseOtlpModSystem.cs,Pulse/EngineProbe.cs,Pulse/AttributionProbe.cs,Pulse/AttributionMetrics.Server.cs,Pulse/StratumTimingsMetrics.Server.cs,contrib/**,tools/**" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build Pulse.slnx -c Release

      # Has to run after the build and before the end step, so the reports exist by the time the
      # scanner uploads them. The opencover format comes from coverlet.collector, referenced by
      # every test project; the scenarios boot a real server, which is where the HTTP path gets
      # its coverage (the ModSystems stay excluded above regardless: the loader loads them outside
      # coverlet's instrumentation, whatever a scenario exercises). Pulse.Otlp.Tests joined this
      # loop with the OTLP export failure log: before it, nothing ever ran Pulse.Otlp's own unit
      # tests under coverage, so Sonar saw every line in Pulse.Otlp as uncovered new code
      # regardless of what the suite actually exercised.
      - name: Tests with coverage
        run: |
          set -e
          for p in Pulse.Tests Pulse.Scenarios Pulse.Otlp.Tests; do
            dotnet test "$p/$p.csproj" -c Release --no-build \
              --filter "Category!=Cost" \
              --collect:"XPlat Code Coverage;Format=opencover" \
              --results-directory TestResults
          done

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
