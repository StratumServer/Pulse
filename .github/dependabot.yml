version: 2

# Actions are pinned by major tag, so patch and minor releases arrive on their own and only a
# new major needs a pull request; NuGet packages move at a similar pace. Monthly is enough for
# both.
#
# target-branch: dev on both entries because the default branch, main, is released stable
# (0.1.0) and only takes changes through a dev-to-main release pull request, not directly from
# Dependabot.
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    # Two groups: the test stack and OpenTelemetry each get their own monthly pull request, so a
    # bad bump in one does not turn the other's update red as part of the same PR. No catch-all
    # group: GitHub's docs say a dependency lands in the first group it matches, but in practice a
    # third "other" group with a "*" pattern still caught test-stack and OpenTelemetry packages
    # (PRs #66 and #67). Every NuGet dependency here already falls under test-stack, opentelemetry,
    # or the Pixnop.Atlas.* harness ignored below, so the catch-all had nothing of its own to
    # justify that risk.
    groups:
      test-stack:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
    ignore:
      # Our own test harness; bumped by hand together with the scenario changes a new version
      # needs, not on Dependabot's schedule.
      - dependency-name: "Pixnop.Atlas.*"
      # Coverage only runs in the Sonar job, and that job skips Dependabot pull requests, so a
      # breaking major here would build and test green with nobody watching coverage.
      - dependency-name: "coverlet.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
