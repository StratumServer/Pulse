# Prometheus and Grafana for a Linux machine you administer (a rented server, or a Linux
# desktop running the game server), wired exactly like the two `docker run` commands in this
# folder's README, as one `docker compose up -d`. On Windows or macOS, use
# docker-compose.desktop.yml instead: host networking below only works on Linux.
#
# Both services bind to 127.0.0.1 only (GF_SERVER_HTTP_ADDR and --web.listen-address below), on
# purpose. Host networking puts a container directly on the machine's own network, and Grafana's
# anonymous access has no password of its own, so without an explicit bind, anyone who can reach
# this machine at all, not just log into it, could administer Grafana, including pointing its
# data sources at addresses of their own choosing. To look at the dashboard from another
# computer, tunnel over SSH instead of widening either bind:
#   ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 user@your-server
# then open http://localhost:3000 on your own computer. docs/getting-started.md covers this.
#
# Both services restart automatically, including after this machine reboots, until you run
# `docker compose down` yourself.
services:
  prometheus:
    image: prom/prometheus
    container_name: pulse-prom
    network_mode: host
    volumes:
      - ./:/etc/pulse
    command:
      - --config.file=/etc/pulse/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: pulse-graf
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./provisioning:/etc/grafana/provisioning
    restart: unless-stopped
